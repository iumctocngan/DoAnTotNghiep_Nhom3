[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-edu-rag"
version = "0.1.0"
description = "RAG module for the CMS Edu system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "PyJWT==2.15.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "google-genai==2.27.0",
    "openpyxl==3.1.5",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "qdrant-client[fastembed]==1.19.1",
    "sentence-transformers==6.1.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
